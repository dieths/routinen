<body>
<div class="shell" id="app">
<header class="top">
  <div class="brand"><div class="brand-icon" aria-hidden="true">✨</div><div><strong>Unser Tagesplan</strong><small>Schritt für Schritt durch den Tag</small></div></div>
  <button class="admin-button" type="button" data-action="open-parent">🔒 Elternbereich</button>
</header>
<div class="layout">
  <aside class="panel sidebar" id="sidebar"></aside>
  <main class="content"><div id="welcome" class="welcome"></div><div id="slot-tabs" class="slot-tabs" role="tablist" aria-label="Tageszeit"></div><section class="panel task-panel" id="task-panel" aria-live="polite"></section><div class="footer-note">Du kannst jede Aufgabe einfach antippen. 💜</div></main>
</div>
</div>
<div id="overlay" class="overlay" hidden></div>
<script>
(()=>{'use strict';
const STORAGE='unser-tagesplan-v1';
const WEEKDAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const ALLDAYS=[1,2,3,4,5,6,7], WORKDAYS=[1,2,3,4,5];
const SLOTS=[{id:'morning',name:'Morgens',icon:'☀️',label:'Dein Morgen'},{id:'midday',name:'Mittags',icon:'🍽️',label:'Dein Mittag'},{id:'evening',name:'Abends',icon:'🌙',label:'Dein Abend'}];
const DEFAULT_TIMES={morning:{start:'06:00',end:'11:59'},midday:{start:'12:00',end:'16:59'},evening:{start:'17:00',end:'22:59'}};
const initial=[
 ['morning','Aufstehen','🌅'],['morning','Frühstücken','🥣'],['morning','Zähne putzen','🪥'],['morning','Waschen','🧼'],['morning','Eincremen','🧴'],['morning','Haare kämmen','🪮'],['morning','Anziehen','👕'],['morning','Kindi Rucksack packen','🎒'],['morning','Jacke und Schuhe anziehen','🧥👟'],
 ['midday','Jacke und Schuhe ausziehen','👟'],['midday','Hände waschen','🫧'],['midday','Mittagessen','🍽️'],['midday','Pause','🧸'],
 ['evening','Aufräumen','🧺'],['evening','Händewaschen','🫧'],['evening','Abendessen','🍲'],['evening','Zähne putzen','🪥'],['evening','Waschen','🧼'],['evening','Eincremen','🧴'],['evening','Haare kämmen','🪮'],['evening','Klo','🚽'],['evening','Schlafanzug anziehen','🛌'],['evening','Kleider für morgen rauslegen','👚'],['evening','Gute Nacht Geschichte raussuchen','📖']
];
const uid=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
function fresh(){return {version:1,children:[{id:'maja',name:'Maja',avatar:'🦊',tasks:initial.map((a,i)=>({id:'task-maja-'+i,slot:a[0],title:a[1],icon:a[2],days:a[0]==='midday'?[...WORKDAYS]:[...ALLDAYS],picture:null}))}],times:JSON.parse(JSON.stringify(DEFAULT_TIMES)),pin:'2468',checks:{}}}
function load(){try{const p=JSON.parse(localStorage.getItem(STORAGE));if(p && p.version===1 && Array.isArray(p.children) && p.children.length && p.times && p.checks && typeof p.pin==='string')return p}catch(e){}return fresh()}
let data=load();
let selectedChild=data.children[0].id;
function localISO(date){let y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`}
const parsedate=iso=>new Date(iso+'T12:00:00');
const isToday=iso=>iso===localISO(new Date());
let selectedDate=localISO(new Date());
function currentSlot(){const t=new Date().toTimeString().slice(0,5);return SLOTS.find(s=>data.times[s.id] && data.times[s.id].start<=t && t<=data.times[s.id].end)?.id || (t< data.times.midday.start?'morning':t<data.times.evening.start?'midday':'evening')}
let selectedSlot=currentSlot(), adminSlot='morning', adminSection='tasks', unlocked=false, editingImage=null;
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(data));return true}catch(e){alert('Speichern fehlgeschlagen. Der Gerätespeicher ist eventuell voll. Bitte verkleinere hochgeladene Bilder.');return false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kid=()=>data.children.find(c=>c.id===selectedChild)||data.children[0];
const weekday=()=>{const n=parsedate(selectedDate).getDay();return n===0?7:n};
const tasksFor=(slot, child=kid())=>(child.tasks||[]).filter(t=>t.slot===slot && Array.isArray(t.days) && t.days.includes(weekday()));
const checkKey=()=>selectedDate+'|'+selectedChild;
const doneIds=()=>data.checks[checkKey()]||[];
function completion(slot){const tasks=tasksFor(slot);let done=tasks.filter(t=>doneIds().includes(t.id)).length;return {done,total:tasks.length,pct:tasks.length?Math.round(100*done/tasks.length):0}}
const emojiPic=(t)=>t.picture ? `<img src="${esc(t.picture)}" alt="">` : esc(t.icon||'⭐');
const prettyDate=()=>new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'}).format(parsedate(selectedDate));
const shortDate=()=>new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'numeric',month:'short'}).format(parsedate(selectedDate));
function starProgress(c){
 const max=10;
 const earned=c.total?Math.round(c.done/c.total*max):0;
 const message=!c.total?'Heute ist frei! 🎈':c.done===c.total?'Alles geschafft! 🎉':c.done===0?'Los geht’s! 🌈':c.pct>=75?'Fast geschafft! 🚀':c.pct>=35?'Super gemacht! 🌟':'Toll, weiter so! 💛';
 return `<div class="progress-card" role="group" aria-label="${c.done} von ${c.total} Aufgaben erledigt"><div class="progress-message">${message}</div><div class="star-progress" aria-hidden="true">${Array.from({length:max},(_,i)=>`<span class="star ${i<earned?'earned':''}">⭐</span>`).join('')}</div><div class="progress-caption">${c.done===c.total&&c.total?'Du hast alle Sterne gesammelt!':'Sammle deine Sterne!'}</div></div>`;
}
function render(){
 const child=kid(); const c=completion(selectedSlot); const st=SLOTS.find(s=>s.id===selectedSlot);
 document.getElementById('sidebar').innerHTML=`<div class="smallhead">Wer ist dran?</div><div class="kids" aria-label="Kind auswählen">${data.children.map(ch=>`<button class="kid ${ch.id===selectedChild?'selected':''}" type="button" aria-pressed="${ch.id===selectedChild}" data-action="select-child" data-id="${esc(ch.id)}"><span class="avatar" aria-hidden="true">${esc(ch.avatar||'🌟')}</span><span class="kid-name">${esc(ch.name)}</span><span class="chev">${ch.id===selectedChild?'✓':'›'}</span></button>`).join('')}</div><div class="separator"></div><div class="daybox"><div class="smallhead">Welcher Tag?</div><div class="day-stepper"><button class="date-arr" aria-label="Vorheriger Tag" type="button" data-action="prev-day">‹</button><div class="date-title">${esc(shortDate())}<br><small>${isToday(selectedDate)?'Heute':'Ausgewählter Tag'}</small></div><button class="date-arr" aria-label="Nächster Tag" type="button" data-action="next-day">›</button></div>${isToday(selectedDate)?'':`<button type="button" class="today" data-action="today">Zurück zu heute</button>`}</div>${starProgress(c)}<div class="privacy quiet">🔐 Alles bleibt auf diesem Gerät gespeichert. Für weitere Kinder den Elternbereich öffnen.</div>`;
 document.getElementById('welcome').innerHTML=`<div class="eyebrow">${esc(prettyDate())}${isToday(selectedDate)?' · Heute':''}</div><h1>Hallo, ${esc(child.name)}! ${esc(child.avatar||'🌟')}</h1><p>Heute schaffen wir einen Schritt nach dem anderen. Du kannst das! ✨</p>`;
 document.getElementById('slot-tabs').innerHTML=SLOTS.map(slot=>{const count=completion(slot.id),time=data.times[slot.id];const now=isToday(selectedDate)&&currentSlot()===slot.id;return `<button class="slot ${selectedSlot===slot.id?'active':''}" role="tab" aria-selected="${selectedSlot===slot.id}" type="button" data-action="select-slot" data-slot="${slot.id}"><span class="slot-icon">${slot.icon}</span><strong>${slot.name}${now?'<em>Jetzt</em>':''}</strong><small>${count.done}/${count.total} Schritte</small></button>`}).join('');
 const list=tasksFor(selectedSlot); const activeNow=isToday(selectedDate)&&currentSlot()===selectedSlot;
 const pending=list.filter(t=>!doneIds().includes(t.id)); const visible=pending.slice(0,2); const lastDone=list.find(t=>t.id===doneIds().at(-1)) || [...list].reverse().find(t=>doneIds().includes(t.id));
 document.getElementById('task-panel').innerHTML=`<div class="tasks-head"><div><h2>${st.icon} ${st.label}</h2><p>${esc(data.times[selectedSlot].start)}–${esc(data.times[selectedSlot].end)} Uhr · ${activeNow?'Jetzt ist die richtige Zeit':'Du kannst auch vorher schauen'}</p></div><span class="count-pill" aria-label="${c.done} von ${c.total} Aufgaben erledigt">⭐ ${c.done} / ${c.total}</span></div><div class="thin-track" role="progressbar" aria-label="Erledigte Schritte" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${c.pct}"><div class="thin-bar" style="width:${c.pct}%"></div></div><div class="tasks">${visible.length?visible.map((t,i)=>`<button class="task" type="button" aria-label="${esc(t.title)} erledigen" data-action="toggle" data-id="${esc(t.id)}"><span class="pictogram" aria-hidden="true">${emojiPic(t)}</span><span class="task-name">${esc(t.title)}</span><span class="checkmark" aria-hidden="true">✓</span></button>`).join(''):list.length?'':`<div class="empty"><span class="empty-icon">🎈</span><strong>Hier ist heute frei!</strong><p>Für diesen Wochentag sind keine Schritte eingetragen.</p></div>`}</div>${list.length && c.done===c.total?'<div class="success" role="status">🎉 Juhu! Du hast alle Schritte geschafft!</div>':''}${lastDone?`<button type="button" class="undo-task" data-action="toggle" data-id="${esc(lastDone.id)}">↶ Letzten Schritt rückgängig machen</button>`:''}`;
}
function changeDate(delta){const d=parsedate(selectedDate);d.setDate(d.getDate()+delta);selectedDate=localISO(d);render()}
function toggle(id){const t=tasksFor(selectedSlot).find(t=>t.id===id);if(!t)return;const key=checkKey();const a=new Set(doneIds());a.has(id)?a.delete(id):a.add(id);data.checks[key]=[...a];save();render()}
const overlay=document.getElementById('overlay');
function modal(html,small=false){overlay.hidden=false;overlay.innerHTML=`<div class="modal ${small?'small-modal':''}" role="dialog" aria-modal="true" aria-label="Elternbereich"><button type="button" class="close" data-action="close" aria-label="Schließen">×</button>${html}</div>`;const f=overlay.querySelector('input:not([type=hidden]),button');if(f)f.focus()}
function close(){overlay.hidden=true;overlay.innerHTML=''}
function openParent(){unlocked?showAdmin():lockPrompt()}
function lockPrompt(error=''){modal(`<h2 class="modal-title">🔒 Elternbereich</h2><p class="modal-desc">Hier kannst du Kinder, Aufgaben, Wochentage und Zeiten verwalten.</p><form id="pin-form"><div class="field"><label for="pin-input">Eltern-PIN</label><input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required placeholder="PIN eingeben"></div>${error?`<p class="error">${esc(error)}</p>`:''}<button class="button full" type="submit">Entsperren</button></form><p class="hint">${data.pin==='2468'?'Beim ersten Start lautet die PIN <strong>2468</strong>. Bitte im Elternbereich ändern. ':''}Die PIN ist eine einfache Kindersicherung, kein vollständiger technischer Zugriffsschutz.</p>`,true)}
function tabs(){return `<div class="admin-tabs"><button data-action="admin-section" data-section="tasks" class="admin-tab ${adminSection==='tasks'?'active':''}">📋 Aufgaben</button><button data-action="admin-section" data-section="kids" class="admin-tab ${adminSection==='kids'?'active':''}">🧒 Kinder</button><button data-action="admin-section" data-section="settings" class="admin-tab ${adminSection==='settings'?'active':''}">⏰ Zeiten & Daten</button><button data-action="lock" class="admin-tab">🔒 Sperren</button></div>`}
function showAdmin(message=''){
 let html=`<h2 class="modal-title">🛠️ Elternbereich</h2><p class="modal-desc">Bestimme, was wann erledigt wird. Änderungen werden auf diesem Gerät gespeichert.</p>${tabs()}`;
 if(message)html+=`<p class="success" role="status">${esc(message)}</p>`;
 if(adminSection==='tasks'){
  let child=kid(); const group=child.tasks.filter(t=>t.slot===adminSlot);
  html+=`<div class="field"><label for="choose-child">Aufgaben für welches Kind?</label><select id="choose-child" data-action="choose-admin-child">${data.children.map(c=>`<option value="${esc(c.id)}" ${c.id===selectedChild?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="admin-subtabs">${SLOTS.map(s=>`<button type="button" class="${adminSlot===s.id?'active':''}" data-action="choose-admin-slot" data-slot="${s.id}">${s.icon} ${s.name}</button>`).join('')}</div><div class="section-bar"><h3>${group.length} Aufgaben</h3><button class="button" type="button" data-action="add-task">+ Aufgabe hinzufügen</button></div><div class="item-list">${group.length?group.map((t,i)=>`<div class="admin-item"><span class="ico" aria-hidden="true">${emojiPic(t)}</span><div class="item-main"><strong>${esc(t.title)}</strong><small>${daysLabel(t.days)}</small></div><div class="actions"><button type="button" class="icon-btn" title="Nach oben" aria-label="${esc(t.title)} nach oben" ${i===0?'disabled':''} data-action="move-up" data-id="${esc(t.id)}">↑</button><button type="button" class="icon-btn" title="Nach unten" aria-label="${esc(t.title)} nach unten" ${i===group.length-1?'disabled':''} data-action="move-down" data-id="${esc(t.id)}">↓</button><button type="button" class="icon-btn" title="Bearbeiten" aria-label="${esc(t.title)} bearbeiten" data-action="edit-task" data-id="${esc(t.id)}">✎</button><button type="button" class="icon-btn" title="Löschen" aria-label="${esc(t.title)} löschen" data-action="delete-task" data-id="${esc(t.id)}">×</button></div></div>`).join(''):'<p class="hint">Noch keine Aufgaben für diese Tageszeit.</p>'}</div>`;
 } else if(adminSection==='kids'){
  html+=`<div class="section-bar"><h3>Deine Kinder (${data.children.length})</h3><button class="button" type="button" data-action="add-child">+ Kind hinzufügen</button></div><div class="item-list">${data.children.map(c=>`<div class="admin-item"><span class="ico">${esc(c.avatar||'🌟')}</span><div class="item-main"><strong>${esc(c.name)}</strong><small>${c.tasks.length} Aufgaben hinterlegt</small></div><div class="actions"><button class="button tiny secondary" data-action="edit-child" data-id="${esc(c.id)}">Bearbeiten</button><button class="button tiny danger" data-action="delete-child" data-id="${esc(c.id)}" ${data.children.length===1?'disabled':''}>Löschen</button></div></div>`).join('')}</div><p class="hint">Beim Hinzufügen eines Kindes kannst du die Aufgaben eines anderen Kindes als Vorlage verwenden.</p>`;
 } else {
  html+=`<h3>Zeiten der Tagesroutinen</h3><form id="time-form"><div class="settings-grid">${SLOTS.map(s=>`<div class="time-card"><strong>${s.icon} ${s.name}</strong><div class="field"><label for="start-${s.id}">Von</label><input id="start-${s.id}" name="start-${s.id}" type="time" value="${esc(data.times[s.id].start)}" required></div><div class="field"><label for="end-${s.id}">Bis</label><input id="end-${s.id}" name="end-${s.id}" type="time" value="${esc(data.times[s.id].end)}" required></div></div>`).join('')}</div><p class="hint">Die passende Tageszeit wird beim Öffnen automatisch angezeigt. Andere Tageszeiten bleiben zum Anschauen wählbar.</p><button class="button" type="submit">Zeiten speichern</button></form><div class="separator" style="display:block"></div><h3>Eltern-PIN ändern</h3><form id="pin-change-form"><div class="form-row"><div class="field"><label for="new-pin">Neue PIN (4–8 Ziffern)</label><input id="new-pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="new-password" required></div><div class="field"><label for="repeat-pin">PIN wiederholen</label><input id="repeat-pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="new-password" required></div></div><button class="button secondary" type="submit">PIN ändern</button></form><div class="separator" style="display:block"></div><h3>Datensicherung</h3><p class="hint">Daten sind nur in diesem Browser gespeichert. Sichere sie als Datei, um sie auf ein anderes Gerät zu übertragen.</p><div class="button-stack"><button class="button secondary" data-action="export">⬇ Sicherung herunterladen</button><label class="button outline" for="import-file" style="cursor:pointer">⬆ Sicherung importieren</label><input id="import-file" type="file" accept="application/json,.json" hidden></div><div class="notice">🔐 Die App funktioniert offline und ohne Benutzerkonto. Es gibt noch keine Synchronisation zwischen Geräten. Löscht du Browserdaten, können Häkchen und Einstellungen verloren gehen – daher gelegentlich eine Sicherung herunterladen.</div>`;
 }
 modal(html);
}
function daysLabel(ds){if(!Array.isArray(ds))return 'Keine Tage';if(ds.length===7)return 'Jeden Tag';if(ds.length===5 && WORKDAYS.every(d=>ds.includes(d)))return 'Montag bis Freitag';if(!ds.length)return 'An keinem Tag';return [...ds].sort((a,b)=>a-b).map(d=>WEEKDAYS[d-1]).join(', ')}
function childForm(id){let c=id?data.children.find(x=>x.id===id):null;if(id&&!c)return;modal(`<h2 class="modal-title">${c?'Kind bearbeiten':'Kind hinzufügen'}</h2><p class="modal-desc">Wähle einen Namen und ein Erkennungsbild.</p><form id="child-form" data-id="${esc(id||'')}"><div class="form-row"><div class="field"><label for="child-name">Name</label><input id="child-name" maxlength="35" required value="${esc(c?.name||'')}" placeholder="z. B. Leni"></div><div class="field" style="max-width:125px"><label for="child-avatar">Bild-Emoji</label><input id="child-avatar" maxlength="4" value="${esc(c?.avatar||'🐻')}" aria-label="Emoji für das Kind"></div></div>${!c?`<label style="display:flex;gap:9px;align-items:start;margin-top:15px;font-size:.87rem"><input id="copy-tasks" type="checkbox" checked style="width:19px;height:19px;accent-color:#6656cc">Aufgaben von ${esc(kid().name)} übernehmen (danach anpassbar)</label>`:''}<div class="button-stack"><button type="button" class="button secondary" data-action="back-admin">Zurück</button><button type="submit" class="button">${c?'Speichern':'Kind anlegen'}</button></div></form>`,true)}
function taskForm(id){let child=kid();let t=id?child.tasks.find(t=>t.id===id):null;if(id&&!t)return;let task=t||{title:'',icon:'⭐',days:adminSlot==='midday'?[...WORKDAYS]:[...ALLDAYS],picture:null};editingImage=task.picture||null;
 modal(`<h2 class="modal-title">${id?'Aufgabe bearbeiten':'Neue Aufgabe'}</h2><p class="modal-desc">Eine kurze Beschreibung und ein Bild helfen beim Erkennen.</p><form id="task-form" data-id="${esc(id||'')}"><div class="field"><label for="task-title">Aufgabe</label><input id="task-title" required maxlength="75" value="${esc(task.title)}" placeholder="z. B. Trinkflasche einpacken"></div><div class="form-row"><div class="field" style="max-width:130px"><label for="task-icon">Bild-Emoji</label><input id="task-icon" maxlength="8" value="${esc(task.icon||'⭐')}" aria-label="Bild-Emoji"></div><div class="field"><label for="task-slot">Tageszeit</label><select id="task-slot">${SLOTS.map(s=>`<option value="${s.id}" ${s.id===(t?.slot||adminSlot)?'selected':''}>${s.icon} ${s.name}</option>`).join('')}</select></div></div><div class="field-title" style="margin-top:12px">An welchen Wochentagen?</div><div class="weekdays">${ALLDAYS.map((d,i)=>`<label class="weekday"><input type="checkbox" name="day" value="${d}" ${task.days.includes(d)?'checked':''}><span>${WEEKDAYS[i]}</span></label>`).join('')}</div><div class="field-title">Bild der Aufgabe</div><div class="form-row" style="align-items:center;margin-top:10px"><div class="preview" id="image-preview">${editingImage?`<img src="${esc(editingImage)}" alt="Eigenes Bild">`:esc(task.icon||'⭐')}</div><div style="flex:1"><label class="button secondary" style="cursor:pointer;display:inline-block" for="task-image">📷 Eigenes Bild wählen</label><input id="task-image" type="file" accept="image/*" hidden><button type="button" class="button tiny outline" data-action="remove-image">Bild entfernen</button><div class="hint">Optional: Foto oder Symbol vom Gerät, automatisch verkleinert.</div></div></div><div class="button-stack"><button type="button" class="button secondary" data-action="back-admin">Zurück</button><button class="button" type="submit">Aufgabe speichern</button></div></form>`);
}
function reorder(id,dir){let tasks=kid().tasks;let current=tasks.find(t=>t.id===id);if(!current)return;let group=tasks.filter(t=>t.slot===current.slot);let idx=group.findIndex(t=>t.id===id),other=group[idx+dir];if(!other)return;let i=tasks.indexOf(current),j=tasks.indexOf(other);[tasks[i],tasks[j]]=[tasks[j],tasks[i]];save();showAdmin()}
function deleteTask(id){let t=kid().tasks.find(t=>t.id===id);if(t && confirm('Aufgabe „'+t.title+'“ wirklich löschen?')){kid().tasks=kid().tasks.filter(t=>t.id!==id);save();showAdmin()}}
function deleteChild(id){let c=data.children.find(c=>c.id===id);if(data.children.length<=1||!c)return;if(confirm('Kind „'+c.name+'“ und dessen Aufgaben und Häkchen wirklich löschen?')){data.children=data.children.filter(c=>c.id!==id);Object.keys(data.checks).filter(k=>k.endsWith('|'+id)).forEach(k=>delete data.checks[k]);if(selectedChild===id)selectedChild=data.children[0].id;save();render();showAdmin()}}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kinder-routinen-sicherung-'+localISO(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validImport(d){return d&&d.version===1&&Array.isArray(d.children)&&d.children.length>0&&d.children.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.tasks)&&c.tasks.every(t=>typeof t.id==='string'&&typeof t.title==='string'&&SLOTS.some(s=>s.id===t.slot)&&Array.isArray(t.days)&&t.days.every(n=>Number.isInteger(n)&&n>=1&&n<=7)))&&SLOTS.every(s=>d.times?.[s.id]&&/^\d{2}:\d{2}$/.test(d.times[s.id].start)&&/^\d{2}:\d{2}$/.test(d.times[s.id].end))&&typeof d.checks==='object'&&d.checks!==null&&typeof d.pin==='string'}
function uploadImage(file){if(!file)return;if(file.size>6*1024*1024){alert('Bitte wähle ein Bild unter 6 MB.');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const max=240;let w=img.width,h=img.height;const scale=Math.min(1,max/Math.max(w,h));canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);editingImage=canvas.toDataURL('image/jpeg',.75);const preview=document.getElementById('image-preview');if(preview)preview.innerHTML=`<img src="${esc(editingImage)}" alt="Eigenes Bild">`};img.onerror=()=>alert('Bild konnte nicht gelesen werden.');img.src=reader.result};reader.readAsDataURL(file)}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;
 if(act==='open-parent')openParent();
 else if(act==='close')close();
 else if(act==='select-child'){selectedChild=id;render()}
 else if(act==='select-slot'){selectedSlot=b.dataset.slot;render()}
 else if(act==='prev-day')changeDate(-1);
 else if(act==='next-day')changeDate(1);
 else if(act==='today'){selectedDate=localISO(new Date());selectedSlot=currentSlot();render()}
 else if(act==='toggle')toggle(id);
 else if(act==='admin-section'){adminSection=b.dataset.section;showAdmin()}
 else if(act==='choose-admin-slot'){adminSlot=b.dataset.slot;showAdmin()}
 else if(act==='lock'){unlocked=false;lockPrompt()}
 else if(act==='back-admin')showAdmin();
 else if(act==='add-child')childForm();
 else if(act==='edit-child')childForm(id);
 else if(act==='delete-child')deleteChild(id);
 else if(act==='add-task')taskForm();
 else if(act==='edit-task')taskForm(id);
 else if(act==='delete-task')deleteTask(id);
 else if(act==='move-up')reorder(id,-1);
 else if(act==='move-down')reorder(id,1);
 else if(act==='remove-image'){editingImage=null;const p=document.getElementById('image-preview');if(p)p.textContent=document.getElementById('task-icon')?.value||'⭐'}
 else if(act==='export')exportData();
});
overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)close()});
document.addEventListener('change',e=>{
 if(e.target.id==='choose-child'){selectedChild=e.target.value;render();showAdmin()}
 if(e.target.id==='task-image')uploadImage(e.target.files[0]);
 if(e.target.id==='task-icon'&&!editingImage){const p=document.getElementById('image-preview');if(p)p.textContent=e.target.value||'⭐'}
 if(e.target.id==='import-file' && e.target.files?.[0]){const file=e.target.files[0];if(file.size>10*1024*1024){alert('Sicherung ist zu groß.');return}const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!validImport(obj))throw Error('Ungültiges Format');if(!confirm('Aktuelle Daten durch diese Sicherung ersetzen?'))return;data=obj;selectedChild=data.children[0].id;selectedSlot=currentSlot();save();render();showAdmin('Sicherung wurde importiert.')}catch(err){alert('Diese Datei ist keine gültige Kinder-Routinen-Sicherung.')}};reader.readAsText(file)}
});
document.addEventListener('submit',e=>{
 if(!['pin-form','child-form','task-form','time-form','pin-change-form'].includes(e.target.id))return;e.preventDefault();const f=e.target;
 if(f.id==='pin-form'){if(document.getElementById('pin-input').value===data.pin){unlocked=true;showAdmin()}else lockPrompt('Die PIN ist leider nicht richtig.');return}
 if(!unlocked)return;
 if(f.id==='child-form'){const id=f.dataset.id;let name=document.getElementById('child-name').value.trim(),avatar=document.getElementById('child-avatar').value.trim()||'🌟';if(!name)return;if(id){const c=data.children.find(c=>c.id===id);if(c){c.name=name;c.avatar=avatar}}else{let source=kid(),copy=document.getElementById('copy-tasks').checked;const childId=uid();data.children.push({id:childId,name,avatar,tasks:copy?source.tasks.map(t=>({...t,id:uid(),days:[...t.days]})):[]});selectedChild=childId}save();render();adminSection='kids';showAdmin('Kind gespeichert.');return}
 if(f.id==='task-form'){const id=f.dataset.id,title=document.getElementById('task-title').value.trim(),icon=document.getElementById('task-icon').value.trim()||'⭐',slot=document.getElementById('task-slot').value,days=[...f.querySelectorAll('input[name="day"]:checked')].map(n=>Number(n.value));if(!title)return;if(!days.length){alert('Bitte mindestens einen Wochentag wählen.');return}if(!SLOTS.some(s=>s.id===slot))return;let t=id?kid().tasks.find(t=>t.id===id):null;if(t){Object.assign(t,{title,icon,slot,days,picture:editingImage})}else kid().tasks.push({id:uid(),title,icon,slot,days,picture:editingImage});adminSlot=slot;editingImage=null;save();render();showAdmin('Aufgabe gespeichert.');return}
 if(f.id==='time-form'){let times={};for(const slot of SLOTS){const start=f.querySelector('#start-'+slot.id).value,end=f.querySelector('#end-'+slot.id).value;if(!start||!end||start>end){alert('Bitte für jede Tageszeit einen gültigen Zeitraum wählen (Beginn vor Ende).');return}times[slot.id]={start,end}}const sorted=SLOTS.map(s=>({id:s.id,...times[s.id]})).sort((a,b)=>a.start.localeCompare(b.start));if(sorted.some((s,i)=>i>0 && s.start<=sorted[i-1].end)){alert('Die Zeiträume dürfen sich nicht überschneiden.');return}data.times=times;save();selectedSlot=currentSlot();render();showAdmin('Zeiten gespeichert.');return}
 if(f.id==='pin-change-form'){const a=document.getElementById('new-pin').value,b=document.getElementById('repeat-pin').value;if(!/^\d{4,8}$/.test(a)||a!==b){alert('Bitte zwei gleiche PINs aus 4 bis 8 Ziffern eingeben.');return}data.pin=a;save();showAdmin('Eltern-PIN geändert.');return}
});
render();
